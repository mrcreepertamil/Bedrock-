name: Build and Release Bedrock++ Companion APK

on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "APK version (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        working-directory: .
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#companion-v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH (example: 0.1.0). Got: $VERSION"
            exit 1
          fi

          VERSION_CODE="$(python3 -c 'import sys; a,b,c=map(int,sys.argv[1].split(".")); print(a*1000000+b*1000+c)' "$VERSION")"
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Version is too large for Android versionCode."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Generate Android Gradle wrapper
        working-directory: extensions-app/android
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build installable debug APK
        run: |
          flutter build apk --debug \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Prepare release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "dist/BedrockPP-Companion-$RELEASE_VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedrockPP-Companion-${{ steps.version.outputs.version }}
          path: extensions-app/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}
          name: Bedrock++ Companion ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: extensions-app/dist/*.apk
